<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5"> <!-- Thêm khung bao quanh cho đẹp -->
    <h2 class="text-primary">HTML Forms (Đã dùng Bootstrap)</h2>

    <form action="/action_page.php">
      <div class="mb-3"> <!-- Khoảng cách giữa các dòng -->
          <label for="fname" class="form-label">First name:</label>
          <input type="text" class="form-control" id="fname" name="fname" value="John">
      </div>
      
      <div class="mb-3">
          <label for="lname" class="form-label">Last name:</label>
          <input type="text" class="form-control" id="lname" name="lname" value="Doe">
      </div>

      <input type="submit" class="btn btn-primary" value="Submit">
    </form> 

    <p class="mt-3 text-muted">If you click the "Submit" button, the data will be sent.</p>
</div>

</body>
</html>
