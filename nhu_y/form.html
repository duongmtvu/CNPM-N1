<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-sm p-4" style="max-width: 500px;">
        <h2 class="text-primary mb-4">HTML Forms (Bootstrap)</h2>

        <form action="/action_page.php">
            <div class="mb-3">
                <label for="fname" class="form-label">First name:</label>
                <input type="text" class="form-control" id="fname" name="fname" value="John">
            </div>

            <div class="mb-3">
                <label for="lname" class="form-label">Last name:</label>
                <input type="text" class="form-control" id="lname" name="lname" value="Doe">
            </div>

            <button type="submit" class="btn btn-success w-100">Submit</button>
        </form>

        <p class="text-muted mt-3 small">
            If you click the "Submit" button, the form-data will be sent to "/action_page.php".
        </p>
    </div>
</div>

</body>
</html>
