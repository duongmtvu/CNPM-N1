<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - Phạm Thành Tư Hân</title>
    
    <!-- Bootstrap 5.3.8 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="text-center mb-4 text-primary">HTML Forms with Bootstrap</h2>
        
        <form action="/action_page.php">
            <div class="mb-3">
                <label for="fname" class="form-label">First name: Tư Hản</label>
                <input type="text" id="fname" name="fname" value="John" class="form-control">
            </div>
            
            <div class="mb-3">
                <label for="lname" class="form-label">Last name: Phạm Thành</label>
                <input type="text" id="lname" name="lname" value="Doe" class="form-control">
            </div>
            
            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg px-5">Submit</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
